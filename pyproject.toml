[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-dispute-multi-agent"
version = "1.0.0"
description = "Deterministic multi-agent pipeline for Olist dispute resolution"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
run-disputes = "ecommerce_dispute.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

